name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  GO_VERSION: '1.21'
  PYTHON_VERSION: '3.11'

jobs:
  # ===========================================================================
  # Go Gateway - Build, Test, Lint, Security
  # ===========================================================================
  go-build:
    name: Go Build & Test
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: switchboard_test
          POSTGRES_USER: switchboard
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Build
        run: go build -v ./...

      - name: Run tests
        env:
          POSTGRES_DSN: postgres://switchboard:test_password@localhost:5432/switchboard_test?sslmode=disable
          REDIS_URL: redis://localhost:6379/0
        run: |
          # Run tests with race detection (without coverage to avoid covdata issues)
          go test -v -race ./...
          
          # Run coverage separately (without race detector to avoid covdata tool error)
          go test -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.out
          fail_ci_if_error: false
        continue-on-error: true

  go-lint:
    name: Go Lint
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          args: --timeout=5m

  go-security:
    name: Go Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run gosec
        uses: securego/gosec@master
        with:
          args: ./...

  # ===========================================================================
  # Python Admin API - Build, Test, Lint
  # ===========================================================================
  python-build:
    name: Python Build & Test
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./admin-api

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: switchboard_test
          POSTGRES_USER: switchboard
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: admin-api/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov httpx ruff

      - name: Check syntax
        run: python -m py_compile app.py models.py database.py

      - name: Run ruff (linter)
        run: ruff check . --output-format=github
        continue-on-error: true

      - name: Run tests
        env:
          DATABASE_URL: postgresql://switchboard:test_password@localhost:5432/switchboard_test
          REDIS_URL: redis://localhost:6379/0
          ENVIRONMENT: test
        run: pytest -v --cov=. --cov-report=xml || echo "No tests found"
        continue-on-error: true

  # ===========================================================================
  # Docker Build Verification
  # ===========================================================================
  docker-build:
    name: Docker Build Verification
    runs-on: ubuntu-latest
    needs: [go-build, python-build]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Gateway image (test)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.Gateway
          push: false
          tags: switchboard-gateway:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=test
            GIT_COMMIT=${{ github.sha }}
            BUILD_TIME=${{ github.event.head_commit.timestamp }}

      - name: Build Admin API image (test)
        uses: docker/build-push-action@v5
        with:
          context: ./admin-api
          file: ./admin-api/Dockerfile
          push: false
          tags: switchboard-admin-api:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate docker-compose
        run: docker compose config --quiet