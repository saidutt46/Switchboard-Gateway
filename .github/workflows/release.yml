name: Release

on:
  push:
    tags:
      - 'v*'

env:
  GO_VERSION: '1.21'
  REGISTRY: ghcr.io

jobs:
  # ===========================================================================
  # Build Release Binaries
  # ===========================================================================
  build-binaries:
    name: Build Release Binaries
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build binaries
        run: |
          mkdir -p dist
          
          # Linux AMD64
          GOOS=linux GOARCH=amd64 go build \
            -ldflags "-X main.Version=${{ github.ref_name }} -X main.GitCommit=${{ github.sha }} -X main.BuildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o dist/switchboard-gateway-linux-amd64 \
            ./cmd/gateway
          
          # Linux ARM64
          GOOS=linux GOARCH=arm64 go build \
            -ldflags "-X main.Version=${{ github.ref_name }} -X main.GitCommit=${{ github.sha }} -X main.BuildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o dist/switchboard-gateway-linux-arm64 \
            ./cmd/gateway
          
          # macOS Intel
          GOOS=darwin GOARCH=amd64 go build \
            -ldflags "-X main.Version=${{ github.ref_name }} -X main.GitCommit=${{ github.sha }} -X main.BuildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o dist/switchboard-gateway-darwin-amd64 \
            ./cmd/gateway
          
          # macOS Apple Silicon
          GOOS=darwin GOARCH=arm64 go build \
            -ldflags "-X main.Version=${{ github.ref_name }} -X main.GitCommit=${{ github.sha }} -X main.BuildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o dist/switchboard-gateway-darwin-arm64 \
            ./cmd/gateway
          
          # Windows AMD64
          GOOS=windows GOARCH=amd64 go build \
            -ldflags "-X main.Version=${{ github.ref_name }} -X main.GitCommit=${{ github.sha }} -X main.BuildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o dist/switchboard-gateway-windows-amd64.exe \
            ./cmd/gateway

      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Upload binaries as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: dist/*
          retention-days: 7

  # ===========================================================================
  # Build and Push Docker Images
  # ===========================================================================
  build-gateway-image:
    name: Build Gateway Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repository name
        id: repo
        run: echo "name=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}/gateway
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push Gateway image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.Gateway
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          build-args: |
            VERSION=${{ github.ref_name }}
            GIT_COMMIT=${{ github.sha }}
            BUILD_TIME=${{ github.event.repository.updated_at }}

  build-admin-api-image:
    name: Build Admin API Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repository name
        id: repo
        run: echo "name=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}/admin-api
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push Admin API image
        uses: docker/build-push-action@v5
        with:
          context: ./admin-api
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max

  build-admin-ui-image:
    name: Build Admin UI Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repository name
        id: repo
        run: echo "name=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}/admin-ui
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push Admin UI image
        uses: docker/build-push-action@v5
        with:
          context: ./admin-ui
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max

  # ===========================================================================
  # Create GitHub Release
  # ===========================================================================
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-binaries, build-gateway-image, build-admin-api-image, build-admin-ui-image]
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: binaries
          path: dist

      - name: Lowercase repository name
        id: repo
        run: echo "name=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/switchboard-gateway-linux-amd64
            dist/switchboard-gateway-linux-arm64
            dist/switchboard-gateway-darwin-amd64
            dist/switchboard-gateway-darwin-arm64
            dist/switchboard-gateway-windows-amd64.exe
            dist/checksums.txt
          generate_release_notes: true
          body: |
            ## 🐳 Docker Images

            **Gateway:**
            docker pull ${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}/gateway:${{ github.ref_name }}
            docker pull ${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}/gateway:latest

            **Admin API:**
            docker pull ${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}/admin-api:${{ github.ref_name }}
            docker pull ${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}/admin-api:latest

            **Admin UI:**
            docker pull ${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}/admin-ui:${{ github.ref_name }}
            docker pull ${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}/admin-ui:latest

            ## 📦 Binaries

            Download the appropriate binary for your platform and verify with checksums.txt

            ## 🚀 Quick Start

            **Using Docker:**
            docker run -p 8080:8080 \
              -e POSTGRES_DSN="postgres://..." \
              -e REDIS_URL="redis://..." \
              ${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}/gateway:${{ github.ref_name }}

            **Using Binary (Linux AMD64):**
            wget https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/switchboard-gateway-linux-amd64
            chmod +x switchboard-gateway-linux-amd64
            ./switchboard-gateway-linux-amd64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}