# golangci-lint configuration for Switchboard Gateway
# Using only default linters that catch actual bugs
version: "2"

run:
  timeout: 5m
  tests: true
  go: '1.21'

linters:
  enable:
    # Default linters only - focused on bug detection
    - errcheck      # Check unchecked errors
    - govet         # Go's official analyzer
    - ineffassign   # Detect ineffectual assignments
    - staticcheck   # Advanced static analysis
    - unused        # Find unused code

issues:
  max-issues-per-linter: 0
  max-same-issues: 0