# golangci-lint configuration for Switchboard Gateway
# Version 2 schema (requires golangci-lint-action@v8+)
version: "2"

run:
  timeout: 5m
  tests: true
  go: '1.21'

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused

issues:
  max-issues-per-linter: 0
  max-same-issues: 0